events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # -------------------------------------------------------
    # Catch-all: chặn truy cập qua IP thô (172.20.2.41, ...)
    # Chỉ cho phép domain b14.openledger.vn
    # -------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # -------------------------------------------------------
    # Redirect HTTP → HTTPS
    # Bật khi đã có SSL certificate (Let's Encrypt hoặc tự ký)
    # -------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name b14.openledger.vn;
    #     # Let's Encrypt ACME challenge (certbot)
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }

    # -------------------------------------------------------
    # Backstage — b14.openledger.vn
    # Hiện tại: HTTP thuần (port 80)
    # Chuyển sang HTTPS: xem block HTTPS bên dưới
    # -------------------------------------------------------
    server {
        listen 80;
        server_name b14.openledger.vn;

        # ---- HTTPS (bỏ comment khi có cert) ----
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_session_cache   shared:SSL:10m;
        # ----------------------------------------

        # Proxy đến Backstage (service name trong docker-compose)
        location / {
            proxy_pass         http://backstage:7007;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 10s;
        }
    }

    # -------------------------------------------------------
    # Structurizr on-premise
    # Truy cập trực tiếp qua port 8080 (mapped trong docker-compose)
    #   http://b14.openledger.vn:8080
    #
    # Hoặc nếu muốn route qua nginx (không cần mở port 8080):
    #   1. Xóa "- 8080:8080" trong docker-compose.yml
    #   2. Thêm DNS record structurizr.b14.openledger.vn → 103.67.184.32
    #   3. Bỏ comment block bên dưới
    # -------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name structurizr.b14.openledger.vn;
    #
    #     location / {
    #         proxy_pass         http://structurizr:8080;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host            $host;
    #         proxy_set_header X-Real-IP       $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_read_timeout 120s;
    #     }
    # }
}
