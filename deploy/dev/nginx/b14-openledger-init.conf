# b14-openledger-init.conf — HTTP only, dùng để chạy certbot lần đầu
# Upload file này TRƯỚC khi có SSL cert (make ssl-init)
# Sau khi có cert, thay bằng b14-openledger.conf (make ssl-upgrade)
server {
    listen 80;
    server_name b14.openledger.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Backstage b14 - SSL setup in progress';
        add_header Content-Type text/plain;
    }
}
