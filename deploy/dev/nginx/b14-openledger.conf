# ══════════════════════════════════════════════════════════════════
# b14-openledger.conf
# Gateway Server : 172.20.2.16 | Public IP: 103.67.184.32
# Domain         : b14.openledger.vn
# App Server     : 172.20.2.41:7007 (Backstage)
#
# Traffic flow:
#   [Browser]
#     → [Gateway 172.20.2.16:443 — ms-nginx-proxy]
#       → [App Server 172.20.2.41:7007 — Backstage Node.js backend]
#
# Deploy steps:
#   1. Upload file này:
#      make sync-gateway-nginx   (từ thư mục deploy/dev)
#
#   2. Cấp SSL certificate lần đầu:
#      make ssl-cert             (chạy certbot trên gateway)
#
#   3. Reload nginx:
#      make gateway-reload
# ══════════════════════════════════════════════════════════════════

upstream backstage {
    server 172.20.2.41:7007 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── HTTP → HTTPS Redirect + Certbot ACME Challenge ────────────────
server {
    listen 80;
    server_name b14.openledger.vn;

    # Let's Encrypt ACME webroot challenge (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name b14.openledger.vn;

    # ── TLS / SSL (Let's Encrypt) ────────────────────────────────
    ssl_certificate      /etc/letsencrypt/live/b14.openledger.vn/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/b14.openledger.vn/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL_b14:10m;
    ssl_session_timeout  10m;

    # ── Security Headers ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    client_max_body_size 50M;

    proxy_connect_timeout  10s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # ── Common Proxy Headers ──────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;

    # ── WebSocket (Backstage dùng cho real-time updates) ──────────
    location / {
        proxy_pass         http://backstage;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
